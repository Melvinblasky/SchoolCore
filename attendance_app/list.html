{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between mb-3">

    <h2>Attendance</h2>

    <a
        href="{% url 'attendance_create' %}"
        class="btn btn-primary"
    >
        Take Attendance
    </a>

</div>

<table class="table table-striped">

    <thead>

        <tr>

            <th>Student</th>
            <th>Date</th>
            <th>Status</th>

        </tr>

    </thead>

    <tbody>

        {% for record in records %}

        <tr>

            <td>{{ record.student }}</td>

            <td>{{ record.date }}</td>

            <td>{{ record.status }}</td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="3">

                No attendance records.

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
