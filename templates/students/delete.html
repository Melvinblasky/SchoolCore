{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h3>
            Delete Student
        </h3>

        <p>

            Are you sure you want to delete

            <strong>

                {{ student.first_name }}
                {{ student.last_name }}

            </strong>?

        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger"
            >
                Delete
            </button>

            <a
                href="{% url 'student_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
