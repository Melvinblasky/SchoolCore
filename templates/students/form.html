{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">

        <h3>
            Register Student
        </h3>

    </div>

    <div class="card-body">

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success"
            >
                Save Student
            </button>

            <a
                href="{% url 'student_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
