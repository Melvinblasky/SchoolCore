{% extends 'base.html' %}

{% block content %}

<h2>Class School Fees</h2>

<form method="GET">

    <label>Select Class</label>

    <select
        name="class"
        class="form-control"
    >

        <option value="">
            Choose Class
        </option>

        {% for cls in classes %}

        <option
            value="{{ cls.id }}"
        >

            {{ cls.name }}

        </option>

        {% endfor %}

    </select>

    <button
        type="submit"
        class="btn btn-primary mt-3"
    >
        View Fees
    </button>

</form>

<hr>

{% if fee_structure %}

<div class="card mt-4">

    <div class="card-body">

        <h4>

            {{ selected_class }}

        </h4>

        <p>

            <strong>Session:</strong>

            {{ fee_structure.session }}

        </p>

        <p>

            <strong>Term:</strong>

            {{ fee_structure.term }}

        </p>

        <p>

            <strong>School Fee:</strong>

            ₦{{ fee_structure.amount }}

        </p>

    </div>

</div>

{% endif %}

{% endblock %}
