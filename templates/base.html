<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolCore SMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            height:100vh;
            background:#1f2937;
            color:white;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px;
        }

        .sidebar a:hover{
            background:#374151;
        }

        .card{
            border:none;
            border-radius:12px;
            box-shadow:0 2px 12px rgba(0,0,0,.1);
        }

    </style>

</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">

    <div class="container">

        <a class="navbar-brand" href="/">
            🎓 SchoolCore SMS
        </a>

        <div>

            <a href="/" class="btn btn-light">
                Dashboard
            </a>

            <a href="/students/" class="btn btn-light">
                Students
            </a>

        </div>

    </div>

</nav>

<div class="container-fluid">

<div class="row">

<div class="col-md-2 sidebar">

<h3 class="mt-3 text-center">
🎓 SchoolCore
</h3>

<hr>

<a href="/">Dashboard</a>
<a href="{% url 'student_list' %}">
    Students
</a>

<a href="{% url 'teacher_list' %}" class="active">
    Teachers
</a>

<a href="/results/" class="active">
    Results
</a>

<a
    href="{% url 'finance_dashboard' %}"
>
    Finance
</a>

<a
    href="{% url 'debtors_list' %}"
>
    Debtors
</a>

<a href="{% url 'attendance_list' %}">
    Attendance
</a>

</div>

<div class="col-md-10 p-4">

{% block content %}

{% endblock %}

</div>

</div>

</div>

</body>
</html>
