{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">

    Teachers

</h2>

<table class="table table-bordered">

    <thead>

        <tr>

            <th>Employee ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

        {% for teacher in teachers %}

        <tr>

            <td>

                {{ teacher.employee_id }}

            </td>

            <td>

                {{ teacher.first_name }}
                {{ teacher.last_name }}

            </td>

            <td>

                {{ teacher.email }}

            </td>

            <td>

                <a
                    href="{% url 'teacher_detail' teacher.id %}"
                    class="btn btn-info btn-sm"
                >

                    View

                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4">

                No teachers found.

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
